apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: nginx
  name: nginx-daemonsets
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata: 
      name: nginx-dmn-pod
      labels: 
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
